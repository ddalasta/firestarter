# Fireplace box: ESP32 + CC1101 radio that copies the Valor fireplace remote.
# It only imitates the handset. It never touches the fireplace's own wiring.
#
# Wiring (ESP32 -> CC1101 pin):
#   GND -> 1 GND        3V3 -> 2 VCC (NEVER 5V)
#   GPIO4 -> 3 GDO0 (TX)    GPIO5 -> 4 CSN
#   GPIO18 -> 5 SCK     GPIO23 -> 6 MOSI
#   GPIO19 -> 7 MISO    GPIO16 -> 8 GDO2 (RX)

esphome:
  name: fireplace
  friendly_name: Fireplace

esp32:
  board: esp32dev

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the WiFi details are wrong, the box makes its own network called
  # "Fireplace Setup" so it can still be fixed.
  ap:
    ssid: "Fireplace Setup"
    password: !secret fallback_ap_password

captive_portal:

# Lets us update the box over WiFi later, no cable needed
ota:
  - platform: esphome
    password: !secret ota_password

# The little web page/API the phone remote talks to (port 80)
web_server:
  port: 80
  version: 3
  # Makes the box's page load the phone remote from GitHub (see remote-loader.js).
  # Original button page: http://<box>/?native
  js_include: "remote-loader.js"

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin: GPIO5
  frequency: 315MHz          # Valor remote (FCC ID RTD-G6RH) is 315 MHz
  modulation_type: ASK/OOK   # if captures are only noise, try 2-FSK
  filter_bandwidth: 203kHz   # try 101kHz or 325kHz if captures are messy

remote_transmitter:
  id: rf_tx
  pin: GPIO4                 # CC1101 GDO0
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

# Listening mode: prints the real remote's signals in the log so we can copy them.
# After the codes are captured, change dump to [] and update over WiFi.
remote_receiver:
  pin: GPIO16                # CC1101 GDO2
  dump: []                   # codes captured 2026-11-17; set back to raw to re-capture
  tolerance: 25%
  filter: 50us
  idle: 6ms
  buffer_size: 4kb

# ---------- Backup safety timer ----------
# Whenever the box turns the fire on, it starts counting down 4 hours. When the
# count reaches 0 the box turns the fire off by itself, even if the phone, the
# WiFi and the internet are all down. "Fire off" clears the count.
# The count is saved, so a power blip doesn't forget it. It can never be set
# higher than 240 minutes. 0 means "the box has not turned the fire on".
# Limit: the box only knows about fires IT turned on, not the real handset.
number:
  - platform: template
    name: "safety_minutes_left"
    id: safety_minutes_left
    icon: "mdi:timer-outline"
    unit_of_measurement: min
    min_value: 0
    max_value: 240
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0

interval:
  - interval: 1min
    then:
      - lambda: |-
          float left = id(safety_minutes_left).state;
          if (left >= 1) {
            auto call = id(safety_minutes_left).make_call();
            call.set_value(left - 1);
            call.perform();
            if (left - 1 < 1) id(safety_shutoff).execute();
          }

script:
  - id: safety_shutoff
    mode: single
    then:
      - logger.log:
          level: WARN
          format: "Safety timer: fire has been on 4 hours, turning it off"
      - button.press: fire_off
      # send it a second time in case the first one was missed
      - delay: 20s
      - button.press: fire_off

# The four buttons. Each name matches its id so the phone page's
# /button/<name>/press address works either way.
button:
  - platform: template
    name: "fire_off"
    id: fire_off
    on_press:
      - number.set:
          id: safety_minutes_left
          value: 0
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          # Captured 2026-11-17. Short=320/-630, long=630/-310, ~21 ms frame,
          # remote repeats it every ~53 ms (so ~32 ms gap between copies).
          code: [320, -630, 630, -310, 630, -310, 630, -310, 630, -310, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 320, -630, 630, -310, 630, -310, 630]
          repeat:
            times: 10
            wait_time: 32ms

  - platform: template
    name: "fire_on"
    id: fire_on
    on_press:
      - number.set:
          id: safety_minutes_left
          value: 240          # start the 4-hour safety countdown
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          # Captured 2026-11-17 while holding OFF + up arrow (sent continuously
          # while held, ~3 s). 80 copies at ~53 ms = about 4 s of "holding".
          code: [320, -630, 630, -310, 630, -310, 630, -310, 630, -310, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 320, -630, 320, -630, 630, -310, 630]
          repeat:
            times: 80         # raise this if ignition doesn't take
            wait_time: 32ms

  - platform: template
    name: "flame_up"
    id: flame_up
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          # Captured 2026-11-17 (same timing as Off, different ending)
          code: [320, -630, 630, -310, 630, -310, 630, -310, 630, -310, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 630, -310, 320, -630, 630, -310, 630]
          repeat:
            times: 10
            wait_time: 32ms

  - platform: template
    name: "flame_down"
    id: flame_down
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_tx
          # Captured 2026-11-17
          code: [320, -630, 630, -310, 630, -310, 630, -310, 630, -310, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 630, -310,
                 630, -310, 630, -310, 630, -310, 630, -310, 320, -630, 320, -630,
                 320, -630, 320, -630, 320, -630, 320, -630, 320]
          repeat:
            times: 10
            wait_time: 32ms
